packages:
  - packages/*

allowBuilds:
  '@google/genai': true
  cpu-features: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.30'
  - '@tanstack/react-start-client@1.168.28'
  - '@tanstack/react-start-rsc@0.1.46'
  - '@tanstack/react-start-server@1.167.35'
  - '@tanstack/react-start@1.168.47'
  - '@tanstack/router-core@1.171.25'
  - '@tanstack/router-generator@1.167.31'
  - '@tanstack/router-plugin@1.168.33'
  - '@tanstack/start-plugin-core@1.171.37'
  - '@tanstack/start-server-core@1.169.29'
  - '@tanstack/start-storage-context@1.167.27'
  - electron@43.4.1

# app-builder-lib 26.15.3 代码引用 @electron/get 的 ElectronDownloadCacheMode（v5 才有），
# 但其声明为 ^3.0.0；强制解析 v5 以修复 electron-builder 打包崩溃
overrides:
  '@electron/get': ^5.1.0

# pnpm 10+ 默认拦截依赖的构建脚本，白名单放行必要的原生/二进制依赖
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - cpu-features
  - ssh2
  - '@google/genai'
  - protobufjs
